<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <a class="skip-link" href="#content">본문으로 이동</a>

    <div class="site-grid" aria-hidden="true"></div>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home">
          <span class="site-brand__avatar-wrap" aria-hidden="true">
            <img class="site-brand__avatar" src="{{ '/profile.png' | relative_url }}" width="36" height="36" alt="">
          </span>
          <span>
            <strong>{{ site.title | escape }}</strong>
            <small>{{ site.author.name | default: site.author | default: 'Jiseong Choi' }}</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Insights</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>

    <main id="content" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>{{ site.description | escape }}</p>
        <p>Built on GitHub Pages.</p>
      </div>
    </footer>
  </body>
</html>
