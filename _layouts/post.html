---
layout: default
---

<article class="content-shell post">
  <header class="content-header">
    <p class="eyebrow">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    </p>
    <h1>{{ page.title | escape }}</h1>

    {% if page.tags.size > 0 %}
      <ul class="tag-list tag-list--header" aria-label="Tags">
        {% for tag in page.tags %}
          <li>#{{ tag }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
